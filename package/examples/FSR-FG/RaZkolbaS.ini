; RaZkolbaS settings. Current named layout only.
; [restart] marks settings that require Save and a Skyrim restart.
; Native in [DLSS] selects DLAA; Native in [FSR] selects FSR Native AA.
; Normal FG presenter follows the upscaler, even with FG disabled.
; NR After order: DLSS/FSR -> NR -> FG -> UI. AMD uses only FSR and optional FSR FG.
; Advanced and program-owned settings are grouped below ordinary options.

[Upscaling]
; [restart] DLSS or FSR. Native is selected in the provider quality section. Values: DLSS | FSR.
Upscaler = FSR
; Auto, or a numeric manual bias such as -1.0. Values: Auto | numeric bias.
MipLodBias = Auto
; Apply sub-pixel camera jitter for temporal reconstruction.
EnableJitter = true
; Allow the upscaler to estimate scene exposure.
AutoExposure = true

[DLSS]
; DLSS sharpening, 0-1. Zero disables sharpening.
Sharpness = 0.672
; [restart] Render scale; Native means DLAA at output resolution. Values: Native | Quality | Balanced | Performance | UltraPerformance | UltraQuality.
Quality = Native
; [restart] Requested DLSS model preset; the NVIDIA runtime determines availability. Values: Default | E | F | J | K | L | M.
Preset = K

[FSR]
; [restart] Render scale for FSR. Values: Native | Quality | Balanced | Performance.
Quality = Native
; [restart] FSR3 keeps the analytical runtime; Auto allows fallback; FSR4 requires ML. Values: FSR3 | Auto | FSR4.
Provider = FSR3
; FSR sharpening, 0-1; 0 disables it.
Sharpness = 0.0
; [restart] Unknown, Linear, Gamma22 or SRGB. Select the actual source encoding before enabling FSR.
SourceColorEncoding = Gamma22

[FrameGeneration]
; FG toggle. Disabling interpolation retains the selected presentation host.
Enabled = true
; [restart] FG provider, independent of upscaling. FSR4 ML FG is experimental; unsupported devices report an error. Values: FSR3 | Auto | FSR4.
FsrProvider = FSR3
; NVIDIA: generated frames exclude the real frame. 1=x2, 2=x3, ... 5=x6. Effective count is limited by the GPU/runtime. FSR FG currently generates one frame.
NvidiaGeneratedFrames = 1
; NVIDIA dynamic MFG, if supported by the runtime.
NvidiaDynamicMFG = false
; 0=monitor refresh; otherwise 61-1000 output FPS.
DynamicTargetFPS = 0
; NVIDIA: interpolate the HUD-less scene and UI separately.
NvidiaUIRecomposition = true

[Latency]
; NVIDIA output FPS cap, 0=unlimited; 1-1000.
OutputFPSLimit = 0
; NVIDIA Reflex mode. Values: Off | On | Boost.
Reflex = On

[Interface]
; Keep HUD/menu rendering at the output resolution. Required by community NR/FSR FG.
NativeUI = true
; Request loading artwork on eligible cell transitions.
RequestLoadingArtwork = true
; [restart] FSR FG and community NR require Dedicated. Values: Dedicated | HudlessDetection.
UIComposition = Dedicated

[NeuralRendering]
; NR toggle; requires a compatible installed runtime.
Enabled = false
; After order: DLSS/FSR -> NR -> FG -> UI. Values: Before | After.
Placement = Before
; Requested passes: 1-3. Legacy executes at most 2 and keeps the saved choice.
PassCount = 1
; Temporarily reduce two requested passes to one under selected conditions.
OnePassInCombat = false
; Temporarily reduce two requested passes to one while weapons or spells are drawn.
OnePassWeaponsDrawn = false
; Recovery delay after conditions clear, 0-30 seconds of active gameplay.
PassRecoverySeconds = 5

[NR PASS 1]
; Style sent to the model, 0-7; community game trials have checked 0-2.
Style = 0
; Effect/tone/structure strengths, 0-2. 0 disables the corresponding contribution.
Intensity = 1.0
; NR tone contribution, 0-2; zero disables it.
Tone = 1.0
; NR structure contribution, 0-2; zero disables it.
Structure = 1.0
; -1 copies structure automatically when the runtime supports it; otherwise 0-2.
SkinStructure = 1.0
; Let the NR runtime choose skin structure automatically.
AutoSkin = false
; Keep false for a world-only pass with dedicated UI.
UICorrection = false

[NR PASS 2]
; Runs when PassCount is 2 or 3. Linked settings use pass 1. Unlinking restores these independent overrides; relinking does not erase them.
UseSameSettings = true
; Style sent to the model, 0-7; community game trials have checked 0-2.
Style = 0
; Effect/tone/structure strengths, 0-2. 0 disables the corresponding contribution.
Intensity = 1.0
; NR tone contribution, 0-2; zero disables it.
Tone = 1.0
; NR structure contribution, 0-2; zero disables it.
Structure = 1.0
; -1 copies structure automatically when the runtime supports it; otherwise 0-2.
SkinStructure = 1.0
; Let the NR runtime choose skin structure automatically.
AutoSkin = false
; Keep false for a world-only pass with dedicated UI.
UICorrection = false

[NR PASS 3]
; Community NR only. Runs when PassCount=3; linked settings use pass 1.
UseSameSettings = true
; Style sent to the model, 0-7; community game trials have checked 0-2.
Style = 0
; Effect/tone/structure strengths, 0-2. 0 disables the corresponding contribution.
Intensity = 1.0
; NR tone contribution, 0-2; zero disables it.
Tone = 1.0
; NR structure contribution, 0-2; zero disables it.
Structure = 1.0
; -1 copies structure automatically when the runtime supports it; otherwise 0-2.
SkinStructure = 1.0
; Let the NR runtime choose skin structure automatically.
AutoSkin = false
; Keep false for a world-only pass with dedicated UI.
UICorrection = false

[Hotkeys]
; [restart] Key name (End, Insert, F1-F12) or a hex virtual-key code. Values: key name | hex virtual-key code.
ToggleOverlay = End
; [restart] opt-in to [=NR off and ]=NR on, including with the menu closed.
EnableNRHotkeys = false

[Appearance]
; Optional weather/time/interior profiles for NR and sharpening. Edit in the Neural Rendering tab; shared profile files remain separate.
Enabled = false
; Transition time for appearance presets, in seconds.
SmoothingSeconds = 2.0
; Program-owned count of saved weather appearance entries.
WeatherCount = 0

; ---- Advanced settings: change only when needed ----

[Upscaling Advanced]
; [restart] Diagnostic only: ordinary FSR presentation, with FG unavailable. Leave false.
FsrOrdinaryPresenter = false

[NeuralRendering Advanced]
; [restart] Select the installed NR runtime path. Values: Legacy | Community.
Runtime = Legacy
; [restart] GPU profile: Auto, rtx20-30, rtx40 or rtx50. AMD NR is not yet supported.
Profile = Auto
; [restart] NR source encoding: Unknown, Linear, Gamma22 or SRGB.
SourceColorEncoding = Unknown
; [restart] encoded SDR byte path. Required by the qualified community SDR trial.
SdrBytesTrial = false

[NR PASS 1 Advanced]
; Model preset: 0=default, 1=shipping. Community trial requires 0.
Preset = 0
; 0 or >=1=native; otherwise 0.25-1. Community trial requires 1.
InputScale = 1.0
; Advanced reconstruction mode; qualified SDR path uses Auto. Values: Auto | Residual | Ratio.
ResolveMethod = Auto
; Ratio resolve controls; strengths 0-2.
TransferStrength = 1.0
; NR colour contribution sent to the model.
ColourStrength = 1.0
; Ratio clamp 0.01-16; white point 0.0001-10000.
MaxRatio = 2.0
; NR input white-point multiplier.
WhitePoint = 1.0
; Advanced NR colour-domain flag; must match the actual input.
ColorIsHDR = false
; Experimental preparation options; retain false for the qualified community trial.
PeripheralCompression = false
; Experimental combined NR preparation; leave disabled unless testing.
FusedPreparation = false

[NR PASS 2 Advanced]
; Model preset: 0=default, 1=shipping. Community trial requires 0.
Preset = 0
; 0 or >=1=native; otherwise 0.25-1. Community trial requires 1.
InputScale = 1.0

[NR PASS 3 Advanced]
; Model preset: 0=default, 1=shipping. Community trial requires 0.
Preset = 0
; 0 or >=1=native; otherwise 0.25-1. Community trial requires 1.
InputScale = 1.0

[HDROutput]
; [restart] Experimental HDR10 from a finished SDR image. Requires Windows HDR and a restart. FSR does not support this path. With Community Shaders use its HDR Display.
Enabled = false
; Use the Windows SDR brightness setting for HDR paper white.
MatchWindowsSDRBrightness = true
; HDR paper-white brightness in nits.
PaperWhiteNits = 200
; HDR peak display brightness in nits.
PeakNits = 1000
; HDR HUD/menu brightness in nits.
UIBrightnessNits = 200
; Expansion strength 0-1; expansion start 0.1-0.95.
HighlightStrength = 1
; Start of SDR-to-HDR highlight expansion, 0-1.
ExpansionStart = 0.7
; SDR decoding for experimental HDR output. Values: Gamma22 | SRGB.
SDRTransfer = Gamma22

[Compatibility]
; ReShade effects run before (true) or after (false) upscaling.
ReShadeBeforeUpscaling = false
; Enable the compatibility bridge for Wheeler overlays.
WheelerLateOverlayBridge = true
; Universal-build MFG compatibility; ignored by the Standard build.
NvidiaMFGUnlock = true

[Runtime]
; [restart] paths relative to virtual Data/SKSE/Plugins, or intentional absolute paths.
StreamlineDirectory = RaZkolbaS/NVIDIA/Streamline
; [restart] Legacy NR runtime path, relative to SKSE/Plugins unless absolute.
NRRuntimePath = RaZkolbaS/NVIDIA/nvngx_dlssnr.dll
; [restart] Community catalog root and driver core use Data/SKSE/Plugins/RaZkolbaS as base. Empty catalog root selects the packaged root. Empty driver core selects the active rendering driver's NGX core. Keep NRDriverCore blank for portable installs; explicit paths are diagnostic overrides.
NRRuntimeRoot =
; [restart] Optional NVIDIA driver-core override. Blank discovers the active driver core.
NRDriverCore =

[DynamicResolution]
; [restart] Currently unsupported; leave disabled.
Enabled = false
; [restart] Diagnostic dynamic-resolution oscillation; leave disabled.
Oscillate = false

[Debug]
; Collect GPU timing measurements for the status display.
EnableGPUTimings = true
; Write detailed per-frame diagnostic traces; normally disabled.
EnableFrameTrace = false
; Diagnostic direct sharpening output route; normally disabled.
DirectRCASOutput = false
; Diagnostic direct DLSS output route; normally disabled.
DirectDLSSOutput = false
; identity and errors are always logged. Detailed samples are opt-in.
LogFrameDiagnostics = false
; Write periodic performance measurements to the log.
LogPerformanceMetrics = false
; Interval 1-120 seconds, used only with performance logging enabled.
PerformanceLogIntervalSeconds = 10
; Write menu/source diagnostics to the log; normally disabled.
LogMenuMetrics = false

; ---- Program-owned state ----

[Menu]
; Program-owned menu geometry; saved by the End menu.
WindowX = 40
; Program-owned menu geometry; saved by the End menu.
WindowY = 40
; Program-owned menu geometry; saved by the End menu.
WindowWidth = 640
; Program-owned menu geometry; saved by the End menu.
WindowHeight = 720
; Program-owned menu geometry; saved by the End menu.
LeftColumnFraction = 0.5
