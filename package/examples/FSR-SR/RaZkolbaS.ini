; RaZkolbaS
; Main INI. Each setting is documented beside its value.
; Live settings apply automatically; Save as default persists them for the next launch.
; Backend, quality, runtime paths and marked startup settings require a restart.
; NR After order: DLSS/FSR -> NR -> FG -> UI. Appearance presets are optional.

[Settings]
; Startup: 0=DLSS, 3=DLSS Native (DLAA), 4=FSR.
UpscaleType = 4
; Select automatic mip bias, or use MipLodBias below.
UseOptimalMipLodBias = true
MipLodBias = 0.0
; DLSS/DLAA sharpening. FSR uses its own Sharpness below.
Sharpening = true
; RCAS strength, 0-1.
Sharpness = 0.672
EnableJitter = true
AutoExposure = true
; Keep HUD/menu rendering at the output resolution. Required by community NR/FSR FG.
NativeUI = true
; Request loading artwork on eligible cell transitions.
RequestLoadingArtwork = true

[DLSS]
; Startup. 0=Performance, 1=Balanced, 2=Quality, 3=Ultra Performance, 4=Ultra Quality.
; Native AA is selected using [Settings] UpscaleType=3.
QualityLevel = 2
; NGX values: 0=driver default, 5=E, 6=F, 10=J, 11=K, 12=L, 13=M.
; These numbers differ from AIO19's menu indexes.
Preset = 11

[FSR]
; Startup. Quality, Balanced, Performance or NativeAA.
Quality = NativeAA
; Analytical or Compatible. FSR FG requires Analytical.
ProviderPolicy = Analytical
; FSR sharpening, 0-1; 0 disables it.
Sharpness = 0.0
; Startup color contract: Unknown, Linear, Gamma22 or SRGB.
; Unknown is allowed while FSR is unused; select the verified encoding before enabling FSR.
SourceColorEncoding = Gamma22

[FrameGeneration]
; Live FG toggle. Disabling interpolation retains the selected presentation host.
Enabled = false
; Startup: 0=ordinary presentation (FSR with FG off), 1=NVIDIA, 2=FSR.
; DLSS/DLAA require 1. FSR requires 0 or 2.
Backend = 0
; NVIDIA: generated frames exclude the real frame. 1=x2, 2=x3, ... 5=x6.
; Effective count is limited by the GPU/runtime. FSR FG currently generates one frame.
GeneratedFrames = 1
; NVIDIA dynamic MFG, if supported by the runtime.
DynamicMFG = false
; 0=monitor refresh; otherwise 61-1000 output FPS.
DynamicTargetFPS = 0
; NVIDIA: interpolate the HUD-less scene and UI separately.
UIRecomposition = true
; NVIDIA output FPS cap, 0=unlimited; 1-1000.
OutputFPSLimit = 0
; NVIDIA Reflex: 0=off, 1=on, 2=on+boost.
ReflexMode = 1
; Startup: 0=dedicated native UI, 1=HUD-less detection.
; Community NR and FSR FG require 0.
UICompositionMode = 0

[NeuralRendering]
; Live NR toggle; requires a compatible installed runtime.
Enabled = false
; true=NR before upscaling; false=after upscaling, before FG and UI.
; Community After supports fixed DLSS/FSR render scales, including Native.
BeforeUpscaling = true
; Requested passes: 1-3 for community NR; 1-2 for the legacy path.
PassCount = 1
; Temporarily reduce two requested passes to one under selected conditions.
OnePassInCombat = false
OnePassWeaponsDrawn = false
; Recovery delay after conditions clear, 0-30 seconds of active gameplay.
PassRecoverySeconds = 5
; Startup runtime selection. false=legacy NVIDIA path; true=community profile catalog.
CommunityRuntime = false
; Startup GPU profile: Auto, rtx20-30, rtx40 or rtx50. AMD NR is not yet supported.
Profile = Auto
; Startup NR source encoding: Unknown, Linear, Gamma22 or SRGB.
SourceColorEncoding = Unknown
; Startup encoded SDR byte path. Required by the qualified community SDR trial.
SdrBytesTrial = false

[NR PASS 1]
; Style sent to the model, 0-7; community game trials have checked 0-2.
Style = 0
; Effect/tone/structure strengths, 0-2. 0 disables the corresponding contribution.
Intensity = 1.0
Tone = 1.0
Structure = 1.0
; -1 copies structure automatically when the runtime supports it; otherwise 0-2.
SkinStructure = 1.0
AutoSkin = false
; Keep false for a world-only pass with dedicated UI.
UICorrection = false
; Model preset: 0=default, 1=shipping. Community trial requires 0.
Preset = 0
; 0 or >=1=native; otherwise 0.25-1. Community trial requires 1.
InputScale = 1.0
; 0=Auto, 1=Residual, 2=Ratio. Community native SDR trial requires 0.
ResolveMethod = 0
; Ratio resolve controls; strengths 0-2.
TransferStrength = 1.0
ColourStrength = 1.0
; Ratio clamp 0.01-16; white point 0.0001-10000.
MaxRatio = 2.0
WhitePoint = 1.0
ColorIsHDR = false
; Experimental preparation options; retain false for the qualified community trial.
PeripheralCompression = false
FusedPreparation = false

[NR PASS 2]
; Runs when PassCount is 2 or 3. Linked settings use pass 1.
; Unlinking restores these independent overrides; relinking does not erase them.
UseSameSettings = true
Style = 0
Intensity = 1.0
Tone = 1.0
Structure = 1.0
SkinStructure = 1.0
AutoSkin = false
UICorrection = false
Preset = 0
InputScale = 1.0

[NR PASS 3]
; Community NR only. Runs when PassCount=3; linked settings use pass 1.
UseSameSettings = true
Style = 0
Intensity = 1.0
Tone = 1.0
Structure = 1.0
SkinStructure = 1.0
AutoSkin = false
UICorrection = false
Preset = 0
InputScale = 1.0

[Hotkeys]
; Win32 virtual-key code, 0x23=End. Startup setting.
ToggleOverlay = 0x23
; Startup opt-in to [=NR off and ]=NR on, including with the menu closed.
EnableNRHotkeys = false

[Menu]
; Geometry/divider saved by Save as default. Kept on-screen when resolution changes.
WindowX = 40
WindowY = 40
WindowWidth = 640
WindowHeight = 720
LeftColumnFraction = 0.5

[Appearance]
; Optional weather/time/interior profiles for NR and sharpening.
; Edit in the Neural Rendering tab; shared profile files remain separate.
Enabled = false
SmoothingSeconds = 2.0
WeatherCount = 0

[Compatibility]
; ReShade effects run before (true) or after (false) upscaling.
ReShadeBeforeUpscaling = false
WheelerLateOverlayBridge = true
; Startup Universal-build MFG compatibility; ignored by the Standard build.
NvidiaMFGUnlock = true

[Runtime]
; Startup paths relative to virtual Data/SKSE/Plugins, or intentional absolute paths.
StreamlineDirectory = RaZkolbaS/NVIDIA/Streamline
NRRuntimePath = RaZkolbaS/NVIDIA/nvngx_dlssnr.dll
; Community catalog root and driver core use Data/SKSE/Plugins/RaZkolbaS as base.
; Empty catalog root selects the packaged root. Empty driver core selects the active rendering driver's NGX core.
; Keep NRDriverCore blank for portable installs; explicit paths are diagnostic overrides.
NRRuntimeRoot =
NRDriverCore =

[HDROutput]
; Experimental HDR10 from a finished SDR image. Requires Windows HDR and a restart.
; FSR does not support this path. With Community Shaders use its HDR Display.
Enabled = false
MatchWindowsSDRBrightness = true
PaperWhiteNits = 200
PeakNits = 1000
UIBrightnessNits = 200
; Expansion strength 0-1; expansion start 0.1-0.95.
HighlightStrength = 1
ExpansionStart = 0.7
; SDR decoding: 0=gamma 2.2, 1=sRGB.
SDRTransfer = 0

[DynamicResolution]
; Currently unsupported; leave disabled.
Enabled = false
Oscillate = false

[Performance]
EnableGPUTimings = true
EnableFrameTrace = false
DirectRCASOutput = false
DirectDLSSOutput = false

[Debug]
; Startup identity and errors are always logged. Detailed samples are opt-in.
LogFrameDiagnostics = false
LogPerformanceMetrics = false
; Interval 1-120 seconds, used only with performance logging enabled.
PerformanceLogIntervalSeconds = 10
LogMenuMetrics = false
