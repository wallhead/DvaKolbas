; RaZkolbaS settings. Current named layout only.
; [restart] marks settings that require Save and a Skyrim restart.
; Native in [DLSS] selects DLAA; Native in [FSR] selects FSR Native AA.
; FG Backend=Auto follows the upscaler; choose FSR to pair DLSS with FSR FG.
; NR After order: DLSS/FSR -> NR -> FG -> UI. AMD uses only FSR and optional FSR FG.
; Advanced and program-owned settings are grouped below ordinary options.

[Upscaling]
; [restart] Upscaling provider. Native is selected in the provider quality section.
; Values: DLSS | FSR.
Upscaler = DLSS
; Automatic mip bias, or a manual numeric bias such as -1.0.
; Values: Auto | numeric bias.
MipLodBias = Auto
; Apply sub-pixel camera jitter for temporal reconstruction.
; Values: true | false.
EnableJitter = true
; Allow the upscaler to estimate scene exposure.
; Values: true | false.
AutoExposure = true

[DLSS]
; Sharpening strength. Zero disables sharpening.
; Range: 0-1.
Sharpness = 0.672
; [restart] Render scale; Native means DLAA at output resolution.
; Values: Native | Quality | Balanced | Performance | UltraPerformance | UltraQuality.
Quality = Native
; [restart] Requested DLSS model preset; the NVIDIA runtime determines availability.
; Values: Default | E | F | J | K | L | M.
Preset = K

[FSR]
; [restart] Render scale for FSR.
; Values: Native | Quality | Balanced | Performance.
Quality = Native
; [restart] FSR3 keeps the analytical runtime; Auto allows fallback; FSR4 requires ML.
; Values: FSR3 | Auto | FSR4.
Provider = FSR3
; Sharpening strength. Zero disables sharpening.
; Range: 0-1.
Sharpness = 0.0
; [restart] Gamma22 is the ENB SDR default. Change this to match other source pipelines.
; Values: Unknown | Linear | Gamma22 | SRGB.
SourceColorEncoding = Gamma22

[FrameGeneration]
; [restart] Presentation backend. Auto uses NVIDIA with DLSS and FSR with FSR upscaling. DLSS can also use FSR FG; FSR upscaling cannot use NVIDIA FG.
; Values: Auto | NVIDIA | FSR.
Backend = Auto
; FG toggle. Disabling interpolation retains the selected presentation host.
; Values: true | false.
Enabled = false
; [restart] FG provider, independent of upscaling. FSR4 ML FG is experimental; unsupported devices report an error.
; Values: FSR3 | Auto | FSR4.
FsrProvider = FSR3
; NVIDIA generated-frame count, excluding the real frame. Effective count is limited by the GPU/runtime. FSR FG generates one frame.
; Values: 1=x2 | 2=x3 | 3=x4 | 4=x5 | 5=x6.
; Whole numbers only.
; Range: 1-5.
NvidiaGeneratedFrames = 1
; NVIDIA dynamic MFG, if supported by the runtime.
; Values: true | false.
NvidiaDynamicMFG = false
; Dynamic MFG target. Zero uses the monitor refresh rate.
; Whole numbers only.
; Range: 0, or 61-1000 output FPS.
DynamicTargetFPS = 0
; NVIDIA: interpolate the HUD-less scene and UI separately.
; Values: true | false.
NvidiaUIRecomposition = true

[Latency]
; NVIDIA presentation output FPS cap. Unavailable with FSR FG, including DLSS to FSR FG. Zero means unlimited.
; Whole numbers only.
; Range: 0, or 1-1000 FPS.
OutputFPSLimit = 0
; NVIDIA presentation Reflex mode. Unavailable with FSR FG, including DLSS to FSR FG.
; Values: Off | On | Boost.
Reflex = On

[Interface]
; Keep HUD/menu rendering at the output resolution. Required by community NR/FSR FG.
; Values: true | false.
NativeUI = true
; Request loading artwork on eligible cell transitions.
; Values: true | false.
RequestLoadingArtwork = true
; [restart] FSR FG and community NR require Dedicated.
; Values: Dedicated | HudlessDetection.
UIComposition = Dedicated

[NeuralRendering]
; NR toggle; requires a compatible installed runtime.
; Values: true | false.
Enabled = false
; After order: DLSS/FSR -> NR -> FG -> UI.
; Values: Before | After.
Placement = Before
; Requested NR pass count. Legacy executes at most two and keeps the saved choice.
; Whole numbers only.
; Range: 1-3.
PassCount = 1
; Temporarily reduce two requested passes to one under selected conditions.
; Values: true | false.
OnePassInCombat = false
; Temporarily reduce two requested passes to one while weapons or spells are drawn.
; Values: true | false.
OnePassWeaponsDrawn = false
; Recovery delay after the selected one-pass conditions clear, measured in active gameplay.
; Range: 0-30 seconds.
PassRecoverySeconds = 5

[NR PASS 1]
; NR model style. Community game trials have checked styles 0-2.
; Whole numbers only.
; Range: 0-7.
Style = 0
; NR effect contribution. Zero disables it.
; Range: 0-2.
Intensity = 1.0
; NR tone contribution. Zero disables it.
; Range: 0-2.
Tone = 1.0
; NR structure contribution. Zero disables it.
; Range: 0-2.
Structure = 1.0
; Skin structure contribution. -1 copies structure automatically when supported.
; Range: -1, or 0-2.
SkinStructure = 1.0
; Let the NR runtime choose skin structure automatically.
; Values: true | false.
AutoSkin = false
; Keep false for a world-only pass with dedicated UI.
; Values: true | false.
UICorrection = false

[NR PASS 2]
; Runs when PassCount is 2 or 3. Linked settings use pass 1. Unlinking restores these independent overrides; relinking does not erase them.
; Values: true | false.
UseSameSettings = true
; NR model style. Community game trials have checked styles 0-2.
; Whole numbers only.
; Range: 0-7.
Style = 0
; NR effect contribution. Zero disables it.
; Range: 0-2.
Intensity = 1.0
; NR tone contribution. Zero disables it.
; Range: 0-2.
Tone = 1.0
; NR structure contribution. Zero disables it.
; Range: 0-2.
Structure = 1.0
; Skin structure contribution. -1 copies structure automatically when supported.
; Range: -1, or 0-2.
SkinStructure = 1.0
; Let the NR runtime choose skin structure automatically.
; Values: true | false.
AutoSkin = false
; Keep false for a world-only pass with dedicated UI.
; Values: true | false.
UICorrection = false

[NR PASS 3]
; Community NR only. Runs when PassCount=3; linked settings use pass 1.
; Values: true | false.
UseSameSettings = true
; NR model style. Community game trials have checked styles 0-2.
; Whole numbers only.
; Range: 0-7.
Style = 0
; NR effect contribution. Zero disables it.
; Range: 0-2.
Intensity = 1.0
; NR tone contribution. Zero disables it.
; Range: 0-2.
Tone = 1.0
; NR structure contribution. Zero disables it.
; Range: 0-2.
Structure = 1.0
; Skin structure contribution. -1 copies structure automatically when supported.
; Range: -1, or 0-2.
SkinStructure = 1.0
; Let the NR runtime choose skin structure automatically.
; Values: true | false.
AutoSkin = false
; Keep false for a world-only pass with dedicated UI.
; Values: true | false.
UICorrection = false

[Hotkeys]
; [restart] Key name (End, Insert, F1-F12) or a hex virtual-key code.
; Values: End | Insert | Home | PageUp | PageDown | Delete | Tab | F1-F12 | hex/decimal virtual-key code.
ToggleOverlay = End
; [restart] opt-in to [=NR off and ]=NR on, including with the menu closed.
; Values: true | false.
EnableNRHotkeys = false

[Appearance]
; Optional weather/time/interior profiles for NR and sharpening. Edit in the Neural Rendering tab; shared profile files remain separate.
; Values: true | false.
Enabled = false
; Transition time for appearance presets.
; Range: 0-30 seconds.
SmoothingSeconds = 2.0
; Program-owned count of saved weather appearance entries.
; Whole numbers only.
WeatherCount = 0

; ---- Advanced settings: change only when needed ----

[Upscaling Advanced]
; [restart] Diagnostic only: ordinary FSR presentation, with FG unavailable. Leave false.
; Values: true | false.
FsrOrdinaryPresenter = false

[NeuralRendering Advanced]
; [restart] Community selects the bundled NR models. Legacy requires a separately installed runtime.
; Values: Legacy | Community.
Runtime = Community
; [restart] NR GPU profile. AMD NR is unsupported.
; Values: Auto | rtx20-30 | rtx40 | rtx50.
Profile = Auto
; [restart] Gamma22 is the ENB SDR default. Keep consistent with the actual source and FSR encoding.
; Values: Unknown | Linear | Gamma22 | SRGB.
SourceColorEncoding = Gamma22
; [restart] encoded SDR byte path. Required by the qualified community SDR trial.
; Values: true | false.
SdrBytesTrial = true

[NR PASS 1 Advanced]
; NR model preset. Community trial requires default.
; Values: 0=default | 1=shipping.
; Whole numbers only.
Preset = 0
; NR internal render scale. Community trial requires Native.
; Range: 0.25-1; 0 or >=1 selects Native.
InputScale = 1.0
; Advanced reconstruction mode; qualified SDR path uses Auto.
; Values: Auto | Residual | Ratio.
ResolveMethod = Auto
; NR detail transfer contribution.
; Range: 0-2.
TransferStrength = 1.0
; NR colour contribution.
; Range: 0-2.
ColourStrength = 1.0
; Maximum ratio for reconstruction.
; Range: 0.01-16.
MaxRatio = 2.0
; NR input white-point multiplier.
; Range: 0.0001-10000.
WhitePoint = 1.0
; Advanced NR colour-domain flag; must match the actual input.
; Values: true | false.
ColorIsHDR = false
; Experimental preparation options; retain false for the qualified community trial.
; Values: true | false.
PeripheralCompression = false
; Experimental combined NR preparation; leave disabled unless testing.
; Values: true | false.
FusedPreparation = false

[NR PASS 2 Advanced]
; NR model preset. Community trial requires default.
; Values: 0=default | 1=shipping.
; Whole numbers only.
Preset = 0
; NR internal render scale. Community trial requires Native.
; Range: 0.25-1; 0 or >=1 selects Native.
InputScale = 1.0

[NR PASS 3 Advanced]
; NR model preset. Community trial requires default.
; Values: 0=default | 1=shipping.
; Whole numbers only.
Preset = 0
; NR internal render scale. Community trial requires Native.
; Range: 0.25-1; 0 or >=1 selects Native.
InputScale = 1.0

[HDROutput]
; [restart] Experimental HDR10 from a finished SDR image. Requires Windows HDR and a restart. FSR does not support this path. With Community Shaders use its HDR Display.
; Values: true | false.
Enabled = false
; Use the Windows SDR brightness setting for HDR paper white.
; Values: true | false.
MatchWindowsSDRBrightness = true
; HDR paper-white brightness.
; Range: 80-1000 nits.
PaperWhiteNits = 200
; HDR peak display brightness.
; Range: 80-10000 nits.
PeakNits = 1000
; HDR HUD/menu brightness.
; Range: 80-1000 nits.
UIBrightnessNits = 200
; HDR highlight expansion strength.
; Range: 0-1.
HighlightStrength = 1
; Start of SDR-to-HDR highlight expansion.
; Range: 0.1-0.95.
ExpansionStart = 0.7
; SDR decoding for experimental HDR output.
; Values: Gamma22 | SRGB.
SDRTransfer = Gamma22

[Compatibility]
; ReShade effects run before (true) or after (false) upscaling.
; Values: true | false.
ReShadeBeforeUpscaling = false
; Enable the compatibility bridge for Wheeler overlays.
; Values: true | false.
WheelerLateOverlayBridge = true
; Universal-build MFG compatibility; ignored by the Standard build.
; Values: true | false.
NvidiaMFGUnlock = true

[Runtime]
; [restart] paths relative to virtual Data/SKSE/Plugins, or intentional absolute paths.
StreamlineDirectory = RaZkolbaS/NVIDIA/Streamline
; [restart] Optional Legacy NR runtime path; ignored by Community. This separate runtime is not bundled.
NRRuntimePath = RaZkolbaS/NVIDIA/nvngx_dlssnr.dll
; [restart] Community catalog root and driver core use Data/SKSE/Plugins/RaZkolbaS as base. Empty catalog root selects the packaged root. Empty driver core selects the active rendering driver's NGX core. Keep NRDriverCore blank for portable installs; explicit paths are diagnostic overrides.
NRRuntimeRoot =
; [restart] Optional NVIDIA driver-core override. Blank discovers the active driver core.
NRDriverCore =

[DynamicResolution]
; [restart] Currently unsupported; leave disabled.
; Values: true | false.
Enabled = false
; [restart] Diagnostic dynamic-resolution oscillation; leave disabled.
; Values: true | false.
Oscillate = false

[Debug]
; Collect GPU timing measurements for the status display.
; Values: true | false.
EnableGPUTimings = true
; Write detailed per-frame diagnostic traces; normally disabled.
; Values: true | false.
EnableFrameTrace = false
; Diagnostic direct sharpening output route; normally disabled.
; Values: true | false.
DirectRCASOutput = false
; Diagnostic direct DLSS output route; normally disabled.
; Values: true | false.
DirectDLSSOutput = false
; identity and errors are always logged. Detailed samples are opt-in.
; Values: true | false.
LogFrameDiagnostics = false
; Write periodic performance measurements to the log.
; Values: true | false.
LogPerformanceMetrics = false
; Interval used when performance logging is enabled.
; Whole numbers only.
; Range: 1-120 seconds.
PerformanceLogIntervalSeconds = 10
; Write menu/source diagnostics to the log; normally disabled.
; Values: true | false.
LogMenuMetrics = false

; ---- Program-owned state ----

[Menu]
; Program-owned menu geometry; saved by the End menu.
WindowX = 40
; Program-owned menu geometry; saved by the End menu.
WindowY = 40
; Program-owned menu geometry; saved by the End menu.
WindowWidth = 640
; Program-owned menu geometry; saved by the End menu.
WindowHeight = 720
; Program-owned menu geometry; saved by the End menu.
LeftColumnFraction = 0.5
